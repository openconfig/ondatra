syntax = "proto3";

package ondatra;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openconfig/ondatra/proto";

// TestStatus represents the outcome of a test case execution.
enum TestStatus {
  TEST_STATUS_UNSPECIFIED = 0;
  TEST_STATUS_PASS = 1;
  TEST_STATUS_FAIL = 2;
  TEST_STATUS_NOT_RUN = 3;
}

// TestResult represents the result of an individual test case execution.
message TestResult {
  // Test identifier (e.g., FeatureProfile test plan ID "ACL-1.1" or test
  // executable name).
  string test_id = 1;

  // Execution status.
  TestStatus status = 2;

  // Human-readable status details, error messages, or failure diagnostics.
  string status_details = 3;

  // Execution timestamp.
  google.protobuf.Timestamp execution_timestamp = 4;

  // Git commit hash (HEAD) of the test code that produced this result, as
  // reported by the "git.commit" suite property. Empty if not reported.
  string git_commit = 5;

  // Whether the test code had uncommitted changes, as reported by the
  // "git.clean" suite property. Unset if not reported, so that an unknown
  // state is distinguishable from a clean one.
  optional bool git_dirty = 6;
}
